[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-sage-mcp"
version = "1.0.0"
description = "A small MCP server for one persistent SageMath kernel: eight tools, honest busy/timeout/interrupt semantics."
readme = "README.md"
# `mcp` ships the server SDK (pydantic, anyio, jsonschema); it is the only runtime
# dependency of the MCP side.  Sage is NOT a Python dependency: user code runs in
# a separate kernel process started with Sage's own interpreter.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JGCoelho", email = "josegustavocoelho@gmail.com" }]
keywords = ["mcp", "sagemath", "sage", "model-context-protocol", "computer-algebra"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
# only the `notebook` tool needs these; it runs under Sage's interpreter
notebook = ["nbformat>=5"]

[project.urls]
Homepage = "https://github.com/JGCoelho/simple-sagemath-mcp"
Source = "https://github.com/JGCoelho/simple-sagemath-mcp"

[project.scripts]
simple-sage-mcp = "sage_mcp:main"
simple-sage-mcp-check = "sage_mcp:check_main"

[tool.setuptools]
py-modules = ["sage_mcp", "sage_client", "sage_kernel", "subproc", "limits"]
